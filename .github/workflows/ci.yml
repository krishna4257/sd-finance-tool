name: CI Pipeline

on:
  push:
    branches: [ main, jk_dev ]
  pull_request:
    branches: [ main, jk_dev ]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint with Flake8 (Syntax & Undefined Names)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Regression Test Suite
        env:
          TESTING: "True"
          FLASK_ENV: "testing"
          DISABLE_SECURE_COOKIE: "1"
          WTF_CSRF_ENABLED: "False"
          SECRET_KEY: "ci-testing-secret-key-32-chars-minimum-length"
          MOBILE_QUEUE_HMAC_SECRET: "ci-test-hmac-secret-32-chars-long"
          ADMIN_RESET_PASSWORD: "ci-test-reset-pass"
          DB_HOST: "localhost"
          DB_NAME: "test_db"
          DB_USER: "test_user"
          DB_PASSWORD: "test_password"
          DB_PORT: "5432"
        run: |
          python -m unittest discover -s tests -p "test_phase*.py"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <style>
  <![CDATA[
    /* ==========================================================================
       CENTRAL BANK 3D MASTER ROYAL LOGO ANIMATIONS
       Harmonized with Smart Counting (logo.svg) & Chit Fund (chit-logo.svg)
       ========================================================================== */

    /* 3D Pillar / Piston Growth Animation (Harmonized with logo.svg scaleY) */
    @keyframes bank-pillar-pulse {
      0% { transform: scaleY(1); }
      15% { transform: scaleY(1.18); }
      30% { transform: scaleY(1); }
      100% { transform: scaleY(1); }
    }

    /* Floating Levitation for 3D Royal Vault Crown & Central Shield */
    @keyframes vault-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    /* Ambient Royal Gold Aura Soft Breathing */
    @keyframes royal-aura-pulse {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 0.7; }
    }

    /* Metallic Light Sweep across Pediment & Roof */
    @keyframes metallic-sweep {
      0% { transform: translateX(-80px) skewX(-25deg); opacity: 0; }
      20% { opacity: 0.85; }
      60% { transform: translateX(80px) skewX(-25deg); opacity: 0.85; }
      100% { transform: translateX(80px) skewX(-25deg); opacity: 0; }
    }

    /* Central Rupee & Crown Glow */
    @keyframes royal-glow {
      0%, 100% { filter: drop-shadow(0 0 3px rgba(251, 191, 36, 0.5)); }
      50% { filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.95)); }
    }

    /* Rising Prosperity Wealth Particles */
    @keyframes gold-sparkle-1 {
      0% { transform: translateY(0px) scale(0.6); opacity: 0; }
      30% { opacity: 0.9; }
      100% { transform: translateY(-40px) scale(1.2); opacity: 0; }
    }
    @keyframes gold-sparkle-2 {
      0% { transform: translateY(0px) scale(0.5); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: translateY(-48px) scale(1.1); opacity: 0; }
    }
    @keyframes gold-sparkle-3 {
      0% { transform: translateY(0px) scale(0.7); opacity: 0; }
      25% { opacity: 0.85; }
      100% { transform: translateY(-38px) scale(1.3); opacity: 0; }
    }

    /* Animated CSS Classes */
    .pillar {
      animation: bank-pillar-pulse infinite cubic-bezier(0.45, 0, 0.55, 1);
      will-change: transform;
    }
    .pillar-1 { transform-origin: 64px 170px; animation-duration: 4.0s; animation-delay: 0.2s; }
    .pillar-2 { transform-origin: 101px 170px; animation-duration: 4.4s; animation-delay: 0.9s; }
    .pillar-3 { transform-origin: 139px 170px; animation-duration: 4.1s; animation-delay: 0.4s; }
    .pillar-4 { transform-origin: 176px 170px; animation-duration: 4.5s; animation-delay: 1.2s; }

    .vault-crown {
      animation: vault-float 3.6s ease-in-out infinite;
      transform-origin: 120px 80px;
    }

    .royal-aura {
      animation: royal-aura-pulse 3.8s ease-in-out infinite;
      transform-origin: 120px 120px;
    }

    .sweep-bar {
      animation: metallic-sweep 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .emblem-glow {
      animation: royal-glow 2.8s ease-in-out infinite;
    }

    .sparkle-1 { animation: gold-sparkle-1 3.2s ease-out infinite; }
    .sparkle-2 { animation: gold-sparkle-2 3.9s ease-out 1.1s infinite; }
    .sparkle-3 { animation: gold-sparkle-3 3.5s ease-out 2.0s infinite; }
  ]]>
  </style>

  <defs>
    <!-- Background Radial Ground Shadow -->
    <radialGradient id="cb-ground-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Royal Gold Background Aura -->
    <radialGradient id="cb-royal-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Deep Navy & Cyan 3D Isometric Base Block -->
    <linearGradient id="cb-base-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050b14" />
      <stop offset="50%" stop-color="#0b172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- 3D Gold Pediment & Roof Gradient -->
    <linearGradient id="cb-gold-pediment" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- 3D Gold Front Facet -->
    <linearGradient id="cb-gold-front" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="25%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- 3D Columns / Pillars Cylinder Gradient -->
    <linearGradient id="cb-pillar-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="25%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1322" />
    </linearGradient>

    <linearGradient id="cb-pillar-cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Central Royal Shield Gradient -->
    <linearGradient id="cb-shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Clip Path for Metallic Light Sweep -->
    <clipPath id="pediment-clip">
      <polygon points="120,38 38,78 202,78" />
    </clipPath>
  </defs>

  <!-- ==================== 1. AMBIENT AURA & DEPTH ==================== -->
  <!-- Ambient Breathing Gold Glow -->
  <circle class="royal-aura" cx="120" cy="120" r="100" fill="url(#cb-royal-aura)" />

  <!-- Ground Shadow for 3D Isometric Stand -->
  <ellipse cx="120" cy="208" rx="88" ry="16" fill="url(#cb-ground-shadow)" />

  <!-- ==================== 2. CENTRAL BANK ARCHITECTURE ==================== -->

  <!-- A. 3D Foundation Pedestal / Steps -->
  <!-- Bottom Step -->
  <path d="M 28 196 L 42 186 L 198 186 L 212 196 L 208 202 L 32 202 Z" fill="#09101d" stroke="#f59e0b" stroke-width="0.75" />
  <rect x="32" y="198" width="176" height="5" rx="2" fill="url(#cb-base-body)" />

  <!-- Middle Step -->
  <rect x="38" y="188" width="164" height="8" rx="2" fill="#0f172a" stroke="#eab308" stroke-width="0.6" />
  <line x1="42" y1="189" x2="198" y2="189" stroke="#fef08a" stroke-width="0.8" opacity="0.6" />

  <!-- Top Stylobate Floor (Base for Pillars) -->
  <path d="M 44 186 L 50 178 L 190 178 L 196 186 Z" fill="url(#cb-gold-front)" />
  <rect x="44" y="184" width="152" height="4" fill="#a16207" />

  <!-- B. 4 3D Classical Columns / Isometric Pillars -->
  <!-- Pillar 1 (Left Outer) -->
  <g class="pillar pillar-1">
    <!-- Capital Top -->
    <rect x="56" y="96" width="16" height="5" rx="1.5" fill="url(#cb-pillar-cap)" />
    <!-- Pillar Shaft -->
    <rect x="58" y="101" width="12" height="69" fill="url(#cb-pillar-body)" />
    <!-- Base Bottom -->
    <rect x="56" y="170" width="16" height="5" rx="1.5" fill="url(#cb-pillar-cap)" />
  </g>

  <!-- Pillar 2 (Left Inner) -->
  <g class="pillar pillar-2">
    <!-- Capital Top -->
    <rect x="93" y="96" width="16" height="5" rx="1.5" fill="url(#cb-pillar-cap)" />
    <!-- Pillar Shaft -->
    <rect x="95" y="101" width="12" height="69" fill="url(#cb-pillar-body)" />
    <!-- Base Bottom -->
    <rect x="93" y="170" width="16" height="5" rx="1.5" fill="url(#cb-pillar-cap)" />
  </g>

  <!-- Pillar 3 (Right Inner) -->
  <g class="pillar pillar-3">
    <!-- Capital Top -->
    <rect x="131" y="96" width="16" height="5" rx="1.5" fill="url(#cb-pillar-cap)" />
    <!-- Pillar Shaft -->
    <rect x="133" y="101" width="12" height="69" fill="url(#cb-pillar-body)" />
    <!-- Base Bottom -->
    <rect x="131" y="170" width="16" height="5" rx="1.5" fill="url(#cb-pillar-cap)" />
  </g>

  <!-- Pillar 4 (Right Outer) -->
  <g class="pillar pillar-4">
    <!-- Capital Top -->
    <rect x="168" y="96" width="16" height="5" rx="1.5" fill="url(#cb-pillar-cap)" />
    <!-- Pillar Shaft -->
    <rect x="170" y="101" width="12" height="69" fill="url(#cb-pillar-body)" />
    <!-- Base Bottom -->
    <rect x="168" y="170" width="16" height="5" rx="1.5" fill="url(#cb-pillar-cap)" />
  </g>

  <!-- C. Central Royal Treasury Shield (Positioned Between Pillars) -->
  <g class="vault-crown">
    <!-- Outer Shield Border with Gold Frame -->
    <path d="M 120 102 Q 146 102 146 126 Q 146 156 120 168 Q 94 156 94 126 Q 94 102 120 102 Z"
          fill="url(#cb-shield-grad)" stroke="url(#cb-gold-pediment)" stroke-width="2.5" />
    
    <!-- Inner Fine Gold Trim -->
    <path d="M 120 107 Q 140 107 140 126 Q 140 150 120 161 Q 100 150 100 126 Q 100 107 120 107 Z"
          fill="none" stroke="#facc15" stroke-width="0.8" opacity="0.75" />

    <!-- 3D Royal Indian Rupee Emblem with Glow -->
    <g class="emblem-glow">
      <!-- Upper Horizontal Bar -->
      <rect x="109" y="116" width="22" height="3" rx="1" fill="#fef08a" />
      <!-- Lower Horizontal Bar -->
      <rect x="109" y="123" width="18" height="3" rx="1" fill="#facc15" />
      <!-- Vertical Stem & Loop -->
      <path d="M 115 116 L 115 133 Q 128 133 128 124 Q 128 116 115 116 Z" fill="none" stroke="#facc15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Diagonal Leg -->
      <path d="M 119 131 L 129 146" fill="none" stroke="#fef08a" stroke-width="3.2" stroke-linecap="round" />
      <!-- Center Brilliant Star Gem -->
      <circle cx="120" cy="153" r="1.8" fill="#38bdf8" />
    </g>
  </g>

  <!-- D. Entablature / Architrave (Beam on top of Pillars) -->
  <rect x="42" y="86" width="156" height="8" rx="1.5" fill="url(#cb-gold-front)" stroke="#78350f" stroke-width="0.5" />
  <rect x="38" y="78" width="164" height="8" rx="1" fill="#ca8a04" />
  <line x1="40" y1="79" x2="200" y2="79" stroke="#fef08a" stroke-width="1.2" />

  <!-- E. Grand 3D Triangular Pediment Roof (Temple Gable) -->
  <polygon points="120,38 38,78 202,78" fill="url(#cb-gold-pediment)" stroke="#78350f" stroke-width="1.5" />

  <!-- Pediment Inner Recessed Tympanum -->
  <polygon points="120,45 48,74 192,74" fill="#0f172a" stroke="#ca8a04" stroke-width="1" />

  <!-- Royal Crown Crest in Tympanum -->
  <g class="vault-crown">
    <!-- Imperial Crown Peaks -->
    <path d="M 111 67 L 111 60 L 115 63 L 120 57 L 125 63 L 129 60 L 129 67 Z" fill="url(#cb-gold-front)" stroke="#a16207" stroke-width="0.5" />
    <!-- Crown Jewels -->
    <circle cx="111" cy="59" r="1" fill="#fef08a" />
    <circle cx="120" cy="56" r="1.3" fill="#38bdf8" />
    <circle cx="129" cy="59" r="1" fill="#fef08a" />
    <!-- Crown Base Band -->
    <rect x="110" y="67" width="20" height="2.5" rx="0.5" fill="#facc15" />
  </g>

  <!-- F. Metallic Dynamic Shine Sweep across Pediment -->
  <g clip-path="url(#pediment-clip)">
    <rect class="sweep-bar" x="100" y="30" width="30" height="60" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- G. Acroterion / Crown Finial (Peak Ornament) -->
  <g class="vault-crown">
    <ellipse cx="120" cy="35" rx="5" ry="3" fill="#fef08a" stroke="#a16207" stroke-width="0.5" />
    <circle cx="120" cy="31" r="2.5" fill="#facc15" />
    <polygon points="120,24 122,28 120,30 118,28" fill="#fef08a" />
  </g>

  <!-- ==================== 3. FLOATING GOLD WEALTH PARTICLES ==================== -->
  <g>
    <!-- Sparkle 1 Left -->
    <circle class="sparkle-1" cx="42" cy="115" r="2" fill="#facc15" />
    <!-- Sparkle 2 Right -->
    <circle class="sparkle-2" cx="198" cy="110" r="1.8" fill="#fef08a" />
    <!-- Sparkle 3 Center-Top -->
    <circle class="sparkle-3" cx="120" cy="22" r="1.5" fill="#38bdf8" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <style>
    @keyframes grow-piston {
      0% { transform: scaleY(1); }
      12% { transform: scaleY(1.24); }
      24% { transform: scaleY(1); }
      100% { transform: scaleY(1); }
    }

    .cyl {
      animation: grow-piston infinite cubic-bezier(0.45, 0, 0.55, 1);
    }

    /* Anchored origins at the bottom-center of each cylinder so they grow upwards from the floor.
       Varying prime-like durations and delays ensure a completely randomized, organic pattern. */
    .cyl-0-0 { transform-origin: 150px 150px; animation-duration: 4.1s; animation-delay: 0.3s; }
    .cyl-0-1 { transform-origin: 98px 168px; animation-duration: 3.7s; animation-delay: 1.2s; }
    .cyl-1-0 { transform-origin: 202px 168px; animation-duration: 4.5s; animation-delay: 0.8s; }
    .cyl-0-2 { transform-origin: 46px 186px; animation-duration: 3.9s; animation-delay: 2.1s; }
    .cyl-1-1 { transform-origin: 150px 186px; animation-duration: 4.3s; animation-delay: 0.0s; }
    .cyl-2-0 { transform-origin: 254px 186px; animation-duration: 4.7s; animation-delay: 1.5s; }
    .cyl-1-2 { transform-origin: 98px 204px; animation-duration: 3.5s; animation-delay: 2.7s; }
    .cyl-2-1 { transform-origin: 202px 204px; animation-duration: 4.9s; animation-delay: 0.9s; }
    .cyl-2-2 { transform-origin: 150px 222px; animation-duration: 4.2s; animation-delay: 1.8s; }
  </style>

  <defs>
    <!-- 3D Cylinder Body Gradient -->
    <linearGradient id="cyl-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#061014" />
      <stop offset="50%" stop-color="#0b1e25" />
      <stop offset="100%" stop-color="#163845" />
    </linearGradient>

    <!-- Cylinder Top Gradients (Glow Effects) -->
    <linearGradient id="top-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ec8d3" />
      <stop offset="100%" stop-color="#b8f5fc" />
    </linearGradient>
    <linearGradient id="top-green" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#72cd84" />
      <stop offset="100%" stop-color="#bef9ca" />
    </linearGradient>
    <linearGradient id="top-yellow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bfe600" />
      <stop offset="100%" stop-color="#f0ff99" />
    </linearGradient>

    <!-- Subtle Shadows under Cylinders -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.25)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
  </defs>

  <!-- Ground Shadows for 3D depth -->
  <ellipse cx="150" cy="150" rx="120" ry="60" fill="url(#shadow)" opacity="0.4" />

  <!-- Cylinders rendered Back-to-Front -->

  <!-- (0,0) Back-Center -->
  <g class="cyl cyl-0-0">
    <path d="M 126 80 L 126 150 A 24 12 0 0 0 174 150 L 174 80 A 24 12 0 0 1 126 80 Z" fill="url(#cyl-body)" />
    <ellipse cx="150" cy="80" rx="24" ry="12" fill="url(#top-blue)" />
  </g>

  <!-- (0,1) Mid-Left-Back -->
  <g class="cyl cyl-0-1">
    <path d="M 74.04 110 L 74.04 168 A 24 12 0 0 0 122.04 168 L 122.04 110 A 24 12 0 0 1 74.04 110 Z" fill="url(#cyl-body)" />
    <ellipse cx="98.04" cy="110" rx="24" ry="12" fill="url(#top-blue)" />
  </g>

  <!-- (1,0) Mid-Right-Back -->
  <g class="cyl cyl-1-0">
    <path d="M 177.96 110 L 177.96 168 A 24 12 0 0 0 225.96 168 L 225.96 110 A 24 12 0 0 1 177.96 110 Z" fill="url(#cyl-body)" />
    <ellipse cx="201.96" cy="110" rx="24" ry="12" fill="url(#top-blue)" />
  </g>

  <!-- (0,2) Far-Left -->
  <g class="cyl cyl-0-2">
    <path d="M 22.08 140 L 22.08 186 A 24 12 0 0 0 70.08 186 L 70.08 140 A 24 12 0 0 1 22.08 140 Z" fill="url(#cyl-body)" />
    <ellipse cx="46.08" cy="140" rx="24" ry="12" fill="url(#top-blue)" />
  </g>

  <!-- (1,1) Center -->
  <g class="cyl cyl-1-1">
    <path d="M 126 140 L 126 186 A 24 12 0 0 0 174 186 L 174 140 A 24 12 0 0 1 126 140 Z" fill="url(#cyl-body)" />
    <ellipse cx="150" cy="140" rx="24" ry="12" fill="url(#top-green)" />
  </g>

  <!-- (2,0) Far-Right -->
  <g class="cyl cyl-2-0">
    <path d="M 229.92 140 L 229.92 186 A 24 12 0 0 0 277.92 186 L 277.92 140 A 24 12 0 0 1 229.92 140 Z" fill="url(#cyl-body)" />
    <ellipse cx="253.92" cy="140" rx="24" ry="12" fill="url(#top-blue)" />
  </g>

  <!-- (1,2) Mid-Left-Front -->
  <g class="cyl cyl-1-2">
    <path d="M 74.04 170 L 74.04 204 A 24 12 0 0 0 122.04 204 L 122.04 170 A 24 12 0 0 1 74.04 170 Z" fill="url(#cyl-body)" />
    <ellipse cx="98.04" cy="170" rx="24" ry="12" fill="url(#top-green)" />
  </g>

  <!-- (2,1) Mid-Right-Front -->
  <g class="cyl cyl-2-1">
    <path d="M 177.96 170 L 177.96 204 A 24 12 0 0 0 225.96 204 L 225.96 170 A 24 12 0 0 1 177.96 170 Z" fill="url(#cyl-body)" />
    <ellipse cx="201.96" cy="170" rx="24" ry="12" fill="url(#top-green)" />
  </g>

  <!-- (2,2) Front-Center -->
  <g class="cyl cyl-2-2">
    <path d="M 126 200 L 126 222 A 24 12 0 0 0 174 222 L 174 200 A 24 12 0 0 1 126 200 Z" fill="url(#cyl-body)" />
    <ellipse cx="150" cy="200" rx="24" ry="12" fill="url(#top-yellow)" />
  </g>
</svg>

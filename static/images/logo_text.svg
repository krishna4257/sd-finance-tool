<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <!-- 3D Cylinder Body Gradient -->
    <linearGradient id="text-cyl-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#061014" />
      <stop offset="50%" stop-color="#0b1e25" />
      <stop offset="100%" stop-color="#163845" />
    </linearGradient>

    <!-- Cylinder Top Gradients -->
    <linearGradient id="text-top-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ec8d3" />
      <stop offset="100%" stop-color="#b8f5fc" />
    </linearGradient>
    <linearGradient id="text-top-green" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#72cd84" />
      <stop offset="100%" stop-color="#bef9ca" />
    </linearGradient>
    <linearGradient id="text-top-yellow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bfe600" />
      <stop offset="100%" stop-color="#f0ff99" />
    </linearGradient>

    <!-- Subtle Shadow -->
    <radialGradient id="text-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.18)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
  </defs>

  <!-- Group for scaled 3D cylinder icon on the left -->
  <g transform="translate(10, 8) scale(0.38) translate(-22, -68)">
    <!-- Shadow -->
    <ellipse cx="150" cy="150" rx="120" ry="60" fill="url(#text-shadow)" opacity="0.4" />

    <!-- Cylinders -->
    <!-- (0,0) -->
    <g class="cyl">
      <path d="M 126 80 L 126 150 A 24 12 0 0 0 174 150 L 174 80 A 24 12 0 0 1 126 80 Z" fill="url(#text-cyl-body)" />
      <ellipse cx="150" cy="80" rx="24" ry="12" fill="url(#text-top-blue)" />
    </g>
    <!-- (0,1) -->
    <g class="cyl">
      <path d="M 74.04 110 L 74.04 168 A 24 12 0 0 0 122.04 168 L 122.04 110 A 24 12 0 0 1 74.04 110 Z" fill="url(#text-cyl-body)" />
      <ellipse cx="98.04" cy="110" rx="24" ry="12" fill="url(#text-top-blue)" />
    </g>
    <!-- (1,0) -->
    <g class="cyl">
      <path d="M 177.96 110 L 177.96 168 A 24 12 0 0 0 225.96 168 L 225.96 110 A 24 12 0 0 1 177.96 110 Z" fill="url(#text-cyl-body)" />
      <ellipse cx="201.96" cy="110" rx="24" ry="12" fill="url(#text-top-blue)" />
    </g>
    <!-- (0,2) -->
    <g class="cyl">
      <path d="M 22.08 140 L 22.08 186 A 24 12 0 0 0 70.08 186 L 70.08 140 A 24 12 0 0 1 22.08 140 Z" fill="url(#text-cyl-body)" />
      <ellipse cx="46.08" cy="140" rx="24" ry="12" fill="url(#text-top-blue)" />
    </g>
    <!-- (1,1) -->
    <g class="cyl">
      <path d="M 126 140 L 126 186 A 24 12 0 0 0 174 186 L 174 140 A 24 12 0 0 1 126 140 Z" fill="url(#text-cyl-body)" />
      <ellipse cx="150" cy="140" rx="24" ry="12" fill="url(#text-top-green)" />
    </g>
    <!-- (2,0) -->
    <g class="cyl">
      <path d="M 229.92 140 L 229.92 186 A 24 12 0 0 0 277.92 186 L 277.92 140 A 24 12 0 0 1 229.92 140 Z" fill="url(#text-cyl-body)" />
      <ellipse cx="253.92" cy="140" rx="24" ry="12" fill="url(#text-top-blue)" />
    </g>
    <!-- (1,2) -->
    <g class="cyl">
      <path d="M 74.04 170 L 74.04 204 A 24 12 0 0 0 122.04 204 L 122.04 170 A 24 12 0 0 1 74.04 170 Z" fill="url(#text-cyl-body)" />
      <ellipse cx="98.04" cy="170" rx="24" ry="12" fill="url(#text-top-green)" />
    </g>
    <!-- (2,1) -->
    <g class="cyl">
      <path d="M 177.96 170 L 177.96 204 A 24 12 0 0 0 225.96 204 L 225.96 170 A 24 12 0 0 1 177.96 170 Z" fill="url(#text-cyl-body)" />
      <ellipse cx="201.96" cy="170" rx="24" ry="12" fill="url(#text-top-green)" />
    </g>
    <!-- (2,2) -->
    <g class="cyl">
      <path d="M 126 200 L 126 222 A 24 12 0 0 0 174 222 L 174 200 A 24 12 0 0 1 126 200 Z" fill="url(#text-cyl-body)" />
      <ellipse cx="150" cy="200" rx="24" ry="12" fill="url(#text-top-yellow)" />
    </g>
  </g>

  <!-- Typography: Smart Counting -->
  <text x="112" y="47" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="22" font-weight="700" letter-spacing="-0.03em">
    <tspan fill="#1a4d2e">Smart</tspan><tspan fill="#111827" font-weight="500"> Counting</tspan>
  </text>
</svg>

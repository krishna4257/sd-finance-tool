<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <style>
  <![CDATA[
    /* ==========================================================================
       CHIT FUND 3D MASTER LOGO ANIMATIONS
       Harmonized with Smart Counting 3D Isometric Growth Piston Aesthetics
       ========================================================================== */

    /* 3D Piston Growth Animation (Matches logo.svg scaleY pumping) */
    @keyframes grow-piston {
      0% { transform: scaleY(1); }
      15% { transform: scaleY(1.22); }
      30% { transform: scaleY(1); }
      100% { transform: scaleY(1); }
    }

    /* Floating Levitation for 3D Gold Coin Vault Stack */
    @keyframes coin-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    /* Ambient Gold and Emerald Aura Soft Breathing */
    @keyframes aura-pulse {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.12); opacity: 0.65; }
    }

    /* Metallic Light Sweep across top Gold Coin */
    @keyframes shine-sweep {
      0% { transform: translateX(-60px) skewX(-25deg); opacity: 0; }
      20% { opacity: 0.75; }
      60% { transform: translateX(60px) skewX(-25deg); opacity: 0.75; }
      100% { transform: translateX(60px) skewX(-25deg); opacity: 0; }
    }

    /* Orbital Currency Nodes Rotation along Pooling Ring */
    @keyframes orbit-pulse {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.7; }
      50% { stroke-dashoffset: -24; opacity: 1; }
    }

    @keyframes node-float-1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-4px, -3px) scale(1.15); }
    }

    @keyframes node-float-2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4px, -4px) scale(1.2); }
    }

    @keyframes node-float-3 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(0px, 4px) scale(1.15); }
    }

    /* Rising Wealth Particles */
    @keyframes particle-rise-1 {
      0% { transform: translateY(0px) scale(0.6); opacity: 0; }
      30% { opacity: 0.9; }
      100% { transform: translateY(-45px) scale(1.2); opacity: 0; }
    }
    @keyframes particle-rise-2 {
      0% { transform: translateY(0px) scale(0.5); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: translateY(-50px) scale(1.1); opacity: 0; }
    }
    @keyframes particle-rise-3 {
      0% { transform: translateY(0px) scale(0.7); opacity: 0; }
      25% { opacity: 0.85; }
      100% { transform: translateY(-40px) scale(1.3); opacity: 0; }
    }

    /* Rupee Symbol Inner Glow Pulse */
    @keyframes rupee-glow {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(255, 235, 150, 0.4)); }
      50% { filter: drop-shadow(0 0 7px rgba(255, 215, 0, 0.9)); }
    }

    /* Piston Utility Classes with Anchored Origins */
    .cyl {
      animation: grow-piston infinite cubic-bezier(0.45, 0, 0.55, 1);
      will-change: transform;
    }
    .cyl-left { transform-origin: 55px 155px; animation-duration: 4.2s; animation-delay: 0.2s; }
    .cyl-right { transform-origin: 185px 155px; animation-duration: 4.6s; animation-delay: 1.1s; }
    .cyl-center { transform-origin: 120px 185px; animation-duration: 3.8s; animation-delay: 0.6s; }

    .coin-stack-group {
      animation: coin-float 3.5s ease-in-out infinite;
      transform-origin: 120px 100px;
    }

    .aura-circle {
      animation: aura-pulse 3.5s ease-in-out infinite;
      transform-origin: 120px 125px;
    }

    .orbit-line {
      animation: orbit-pulse 4s linear infinite;
    }

    .node-1 { animation: node-float-1 3.2s ease-in-out infinite; }
    .node-2 { animation: node-float-2 3.7s ease-in-out infinite 0.5s; }
    .node-3 { animation: node-float-3 4.1s ease-in-out infinite 1s; }

    .p-1 { animation: particle-rise-1 3.6s ease-out infinite 0.1s; }
    .p-2 { animation: particle-rise-2 4.2s ease-out infinite 1.4s; }
    .p-3 { animation: particle-rise-3 3.9s ease-out infinite 2.3s; }

    .shine-rect {
      animation: shine-sweep 3.5s ease-in-out infinite 0.8s;
    }

    .rupee-text {
      animation: rupee-glow 3s ease-in-out infinite;
    }
  ]]>
  </style>

  <defs>
    <!-- 3D Metallic Cylinder Body Gradient (Identical to main logo.svg) -->
    <linearGradient id="cyl-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#061014" />
      <stop offset="50%" stop-color="#0b1e25" />
      <stop offset="100%" stop-color="#163845" />
    </linearGradient>

    <!-- Cylinder Glowing Top Caps -->
    <linearGradient id="top-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>
    <linearGradient id="top-emerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <linearGradient id="top-amber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- 3D Gold Coin Gradients -->
    <!-- Main Top Coin Face -->
    <radialGradient id="coin-gold-bright" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="85%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </radialGradient>

    <!-- Mid Coin Top Face -->
    <radialGradient id="coin-gold-mid" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </radialGradient>

    <!-- Bottom Coin Top Face -->
    <radialGradient id="coin-gold-dark" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#713f12" />
    </radialGradient>

    <!-- 3D Coin Side Edges (Depth Layers) -->
    <linearGradient id="coin-edge-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="30%" stop-color="#a16207" />
      <stop offset="70%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="coin-edge-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#3b1a03" />
    </linearGradient>

    <!-- Inner Coin Stroke Sheen -->
    <linearGradient id="coin-inner-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fde047" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#854d0e" stop-opacity="0.3" />
    </linearGradient>

    <!-- Embossed 3D Rupee Symbol Gradient -->
    <linearGradient id="rupee-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef9c3" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Pooling Orbit Gradient -->
    <linearGradient id="orbit-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9" />
    </linearGradient>

    <!-- Ambient Glow & Shadows -->
    <radialGradient id="ambient-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 0, 0, 0.45)" />
      <stop offset="60%" stop-color="rgba(0, 0, 0, 0.15)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>

    <!-- Clip Path for Metallic Coin Sheen -->
    <clipPath id="top-coin-clip">
      <ellipse cx="120" cy="74" rx="42" ry="21" />
    </clipPath>
  </defs>

  <!-- 1. GROUND SHADOW & AMBIENT AURA -->
  <!-- Ambient Soft Glowing Backlight -->
  <circle cx="120" cy="125" r="75" fill="url(#ambient-aura)" class="aura-circle" />

  <!-- 3D Ground Shadow under pistons -->
  <ellipse cx="120" cy="192" rx="90" ry="28" fill="url(#shadow)" />


  <!-- 2. BACK 3D PISTONS (Growth Columns) -->

  <!-- Left Back Piston (Cyan Cap) -->
  <g class="cyl cyl-left">
    <path d="M 35 105 L 35 155 A 20 10 0 0 0 75 155 L 75 105 A 20 10 0 0 1 35 105 Z" fill="url(#cyl-body)" />
    <ellipse cx="55" cy="105" rx="20" ry="10" fill="url(#top-cyan)" />
    <!-- Top inner glow ring -->
    <ellipse cx="55" cy="105" rx="14" ry="7" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- Right Back Piston (Emerald Cap) -->
  <g class="cyl cyl-right">
    <path d="M 165 105 L 165 155 A 20 10 0 0 0 205 155 L 205 105 A 20 10 0 0 1 165 105 Z" fill="url(#cyl-body)" />
    <ellipse cx="185" cy="105" rx="20" ry="10" fill="url(#top-emerald)" />
    <!-- Top inner glow ring -->
    <ellipse cx="185" cy="105" rx="14" ry="7" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
  </g>


  <!-- 3. CHIT POOLING ORBITAL RING & NODES -->
  <g id="pooling-orbit">
    <!-- 3D Isometric Orbital Path -->
    <ellipse cx="120" cy="138" rx="88" ry="36" fill="none" stroke="url(#orbit-gradient)" stroke-width="2.2" stroke-dasharray="10 6" class="orbit-line" />
    <ellipse cx="120" cy="138" rx="88" ry="36" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3" />

    <!-- Orbital Node 1: Left Cyan Currency Bead -->
    <g class="node-1">
      <ellipse cx="32" cy="138" rx="7" ry="4.5" fill="url(#top-cyan)" />
      <ellipse cx="32" cy="138" rx="3.5" ry="2" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- Orbital Node 2: Right Emerald Currency Bead -->
    <g class="node-2">
      <ellipse cx="208" cy="138" rx="7" ry="4.5" fill="url(#top-emerald)" />
      <ellipse cx="208" cy="138" rx="3.5" ry="2" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- Orbital Node 3: Front Gold Pooling Bead -->
    <g class="node-3">
      <ellipse cx="120" cy="174" rx="8.5" ry="5.5" fill="url(#top-amber)" />
      <ellipse cx="120" cy="174" rx="4" ry="2.5" fill="#ffffff" opacity="0.9" />
    </g>
  </g>


  <!-- 4. CENTER 3D BASE PISTON -->
  <g class="cyl cyl-center">
    <path d="M 88 135 L 88 185 A 32 16 0 0 0 152 185 L 152 135 A 32 16 0 0 1 88 135 Z" fill="url(#cyl-body)" />
    <ellipse cx="120" cy="135" rx="32" ry="16" fill="url(#top-amber)" />
  </g>


  <!-- 5. FLOATING 3D GOLD COIN VAULT STACK -->
  <g class="coin-stack-group">

    <!-- Bottom Coin Shadow -->
    <ellipse cx="120" cy="128" rx="42" ry="14" fill="rgba(0,0,0,0.3)" />

    <!-- COIN 1 (BOTTOM) -->
    <!-- 3D Wall (Side Depth) -->
    <path d="M 76 110 L 76 120 A 44 22 0 0 0 164 120 L 164 110 A 44 22 0 0 1 76 110 Z" fill="url(#coin-edge-dark)" />
    <!-- Top Face -->
    <ellipse cx="120" cy="110" rx="44" ry="22" fill="url(#coin-gold-dark)" stroke="#713f12" stroke-width="0.8" />

    <!-- COIN 2 (MIDDLE) -->
    <!-- 3D Wall (Side Depth) -->
    <path d="M 76 92 L 76 102 A 44 22 0 0 0 164 102 L 164 92 A 44 22 0 0 1 76 92 Z" fill="url(#coin-edge-main)" />
    <!-- Top Face -->
    <ellipse cx="120" cy="92" rx="44" ry="22" fill="url(#coin-gold-mid)" stroke="#a16207" stroke-width="0.8" />


    <!-- COIN 3 (TOP MASTER CHIT COIN) -->
    <!-- 3D Wall (Side Depth) -->
    <path d="M 74 74 L 74 86 A 46 23 0 0 0 166 86 L 166 74 A 46 23 0 0 1 74 74 Z" fill="url(#coin-edge-main)" />
    <!-- Side Wall Highlight -->
    <path d="M 74 74 L 74 86 A 46 23 0 0 0 100 95 L 100 83 A 46 23 0 0 1 74 74 Z" fill="#fde047" opacity="0.3" />

    <!-- Outer Rim Base -->
    <ellipse cx="120" cy="74" rx="46" ry="23" fill="#854d0e" />

    <!-- Top Face (Gold Master) -->
    <ellipse cx="120" cy="74" rx="44" ry="22" fill="url(#coin-gold-bright)" stroke="#fef08a" stroke-width="1.2" />

    <!-- Inset Rim Bevel Line -->
    <ellipse cx="120" cy="74" rx="36" ry="18" fill="none" stroke="url(#coin-inner-stroke)" stroke-width="1.8" />

    <!-- 8 Isometric Member Dots (Symbolizing Chit Fund Member Community) -->
    <circle cx="84" cy="74" r="1.6" fill="#713f12" opacity="0.8" />
    <circle cx="156" cy="74" r="1.6" fill="#713f12" opacity="0.8" />
    <circle cx="120" cy="56" r="1.6" fill="#713f12" opacity="0.8" />
    <circle cx="120" cy="92" r="1.6" fill="#713f12" opacity="0.8" />
    <circle cx="94" cy="62" r="1.4" fill="#713f12" opacity="0.7" />
    <circle cx="146" cy="62" r="1.4" fill="#713f12" opacity="0.7" />
    <circle cx="94" cy="86" r="1.4" fill="#713f12" opacity="0.7" />
    <circle cx="146" cy="86" r="1.4" fill="#713f12" opacity="0.7" />

    <!-- Embossed 3D Rupee Emblem (₹) + Chit Vault Diamond -->
    <!-- 3D Shadow for Rupee Text -->
    <text x="121.5" y="83.5" font-family="'Inter', 'SF Pro Display', 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#451a03" text-anchor="middle">₹</text>
    <!-- Front Facing Glowing Rupee Text -->
    <text x="120" y="82" font-family="'Inter', 'SF Pro Display', 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="url(#rupee-gold)" text-anchor="middle" class="rupee-text">₹</text>

    <!-- Top Left & Right Diamond Star Accents on Coin -->
    <polygon points="120,58 121.5,61 120,64 118.5,61" fill="#ffffff" opacity="0.9" />
    <polygon points="120,85 121.2,87.2 120,89.4 118.8,87.2" fill="#fef08a" opacity="0.8" />

    <!-- Metallic Sheen Sweep Animation Clip -->
    <g clip-path="url(#top-coin-clip)">
      <rect x="0" y="45" width="22" height="60" fill="#ffffff" opacity="0.45" class="shine-rect" />
    </g>
  </g>


  <!-- 6. ASCENDING WEALTH PARTICLES & SPARKLES -->
  <g id="wealth-particles">
    <!-- Particle 1: Left Gold Diamond -->
    <polygon points="62,70 65,75 62,80 59,75" fill="#fde047" class="p-1" />
    <!-- Particle 2: Right Emerald Diamond -->
    <polygon points="178,65 181,70 178,75 175,70" fill="#34d399" class="p-2" />
    <!-- Particle 3: Center Top Gold Star -->
    <polygon points="120,28 123,34 120,40 117,34" fill="#ffffff" class="p-3" />
  </g>

</svg>

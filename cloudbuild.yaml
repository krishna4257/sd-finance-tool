steps:
  # Step 1: Build container image
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/sd-finance-tool-2025/sd-repo/sd-finance-app:$COMMIT_SHA', '.']

  # Step 2: Push image to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args: ['push', 'asia-south1-docker.pkg.dev/sd-finance-tool-2025/sd-repo/sd-finance-app:$COMMIT_SHA']

  # Step 3: Deploy to Cloud Run
  - name: gcr.io/cloud-builders/gcloud
    args:
      [
        'run', 'deploy', 'sd-finance-app',
        '--image=asia-south1-docker.pkg.dev/sd-finance-tool-2025/sd-repo/sd-finance-app:$COMMIT_SHA',
        '--region=asia-south1',
        '--allow-unauthenticated'
      ]

images:
  - asia-south1-docker.pkg.dev/sd-finance-tool-2025/sd-repo/sd-finance-app:$COMMIT_SHA
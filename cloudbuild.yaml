steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/sd-repo/sd-finance:latest',
      '.'
    ]

  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'asia-south1-docker.pkg.dev/$PROJECT_ID/sd-repo/sd-finance:latest'
    ]

  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'sd-finance-app',
      '--image', 'asia-south1-docker.pkg.dev/$PROJECT_ID/sd-repo/sd-finance:latest',
      '--region', 'asia-south1',
      '--allow-unauthenticated'
    ]

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/sd-repo/sd-finance:latest'
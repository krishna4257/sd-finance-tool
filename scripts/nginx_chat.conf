# ==============================================================================
# SD Finance: Chat & Media Reverse Proxy Configuration
# File: SD_Accounting_Tool/scripts/nginx_chat.conf
# Include or append this block to /etc/nginx/sites-available/sivadurga.in
# ==============================================================================

# 1. Increase Max Body Size for Compressed Photos and Audio Voice Notes
client_max_body_size 15M;

# 2. Centrifugo Real-time WebSocket Gateway
location /connection/websocket {
    proxy_pass http://127.0.0.1:8001/connection/websocket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Keep WebSocket connection alive for long periods of idle chat
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    
    # Disable buffering for instantaneous sub-10ms delivery
    proxy_buffering off;
}

# 3. Secure Chat Media Static Files (Photos & Audio Voice Notes)
location /chat-media/ {
    alias /var/www/sd-chat-media/;
    expires 30d;
    add_header Cache-Control "private, no-transform";
    try_files $uri =404;
}

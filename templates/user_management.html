{% extends "base.html" %}
{% block content %}
<style>
/* Fix Device ID overflow only for User Management table */
#users-table {
    table-layout: fixed;
    width: 100%;
}

#users-table th,
#users-table td {
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Specifically handle Device ID column (3rd column) */
#users-table td:nth-child(3),
#users-table th:nth-child(3) {
    max-width: 260px;
    word-break: break-all;
    white-space: normal;
}
</style>

<h2 class="page-title">User Management</h2>

<div class="raised-box" style="padding:20px; margin-bottom:20px;">
    <button id="btn-add" class="neumorphic-btn">+ Add User</button>
</div>

<div class="raised-box">
  <div class="customer-table-wrapper">
    <table id="users-table" class="dataTable customer-table">
        <thead>
            <tr>
                <th>Username</th>
                <th>Employee</th>
                <th>Device ID</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div id="user-modal" class="raised-box"
     style="display:none; padding:25px; max-width:450px; margin:auto;">

    <label>Employee</label>
    <select id="u_employee" class="input"></select>

    <label>Username</label>
    <input id="u_username" class="input">

    <label>Password</label>
    <input id="u_password" type="password" class="input">

    <label>Role (Auto from Employee)</label>
    <input id="u_role_display" class="input" disabled>

    <label>Assigned Villages (Auto)</label>
    <select id="u_villages_display" class="input" multiple disabled style="height:120px;"></select>

    <div style="margin-top:15px;">
        <button id="u_save" class="neumorphic-btn">Save</button>
        <button id="u_cancel" class="neumorphic-btn">Cancel</button>
    </div>
</div>


<script>
async function loadEmployees() {
    const res = await fetch('/api/employees');
    const data = await res.json();
    const select = document.getElementById("u_employee");
    select.innerHTML = '';
    data.forEach(e => {
        select.innerHTML += `<option value="${e.eid}">${e.name}</option>`;
    });
}

document.getElementById("btn-add").onclick = async () => {
    await loadEmployees();

    // Reset form
    document.getElementById("u_username").value = "";
    document.getElementById("u_password").value = "";
    document.getElementById("u_role_display").value = "";
    document.getElementById("u_villages_display").innerHTML = "";

    document.getElementById("user-modal").style.display = "block";
};

async function loadUsers(){
    const res = await fetch('/api/users/list');
    const users = await res.json();

    const tbody = document.querySelector('#users-table tbody');
    tbody.innerHTML = '';

    users.forEach(u=>{
        const tr = document.createElement('tr');
        tr.classList.add("data-row");

        tr.innerHTML = `
            <td>${u.username}</td>
            <td>${u.employee_name || '-'}</td>
            <td>${u.device_id || '-'}</td>
            <td>${u.role}</td>
            <td>${u.is_active ? 'Active' : 'Disabled'}</td>
            <td class="action-buttons">
                <button class="neumorphic-btn small toggle-status-btn" data-id="${u.id}" data-active="${u.is_active}">
                    ${u.is_active ? 'Deactivate' : 'Activate'}
                </button>
                ${u.role !== 'admin' ? `
                    <button class="neumorphic-btn small reset-device-btn" data-id="${u.id}">
                        Reset Device
                    </button>
                ` : ``}
                <button class="neumorphic-btn small delete-btn" data-id="${u.id}">
                    Delete
                </button>
            </td>
        `;

        tbody.appendChild(tr);
    });

    document.querySelectorAll('.delete-btn').forEach(btn=>{
        btn.onclick = async () => {
            if(!confirm("Delete user?")) return;

            const r = await fetch('/api/users/delete', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({id: btn.dataset.id})
            });

            const j = await r.json();
            if(j.ok) loadUsers();
        };
    });

    document.querySelectorAll('.reset-device-btn').forEach(btn=>{
        btn.onclick = async () => {
            if(!confirm("Reset device?")) return;

            const r = await fetch('/api/users/reset_device', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({id: btn.dataset.id})
            });

            const j = await r.json();
            if(j.ok) loadUsers();
        };
    });

    document.querySelectorAll('.toggle-status-btn').forEach(btn=>{
        btn.onclick = async () => {

            const isActive = btn.dataset.active === "true";

            if(!confirm(isActive ? "Deactivate this user?" : "Activate this user?")) return;

            const r = await fetch('/api/users/toggle_status', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({id: btn.dataset.id})
            });

            const j = await r.json();
            if(j.ok) loadUsers();
            else alert(j.msg);
        };
    });
}


document.getElementById("u_cancel").onclick = () => {
    document.getElementById("user-modal").style.display = "none";
};

document.getElementById("u_save").onclick = async () => {

    const payload = {
        username: document.getElementById("u_username").value,
        password: document.getElementById("u_password").value,
        employee_id: document.getElementById("u_employee").value
    };

    const res = await fetch("/api/users/add", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    });

    const j = await res.json();

    if (j.ok) {
        location.reload();
    } else {
        alert(j.msg);
    }
};

document.getElementById("u_employee").onchange = async function () {

    const eid = this.value;

    // Fetch employee level
    const empRes = await fetch(`/api/employee_level?eid=${eid}`);
    const empData = await empRes.json();
    document.getElementById("u_role_display").value = empData.level || "";

    // Fetch villages automatically
    const villageRes = await fetch(`/api/villages_by_employee?eid=${eid}`);
    const villages = await villageRes.json();

    const select = document.getElementById("u_villages_display");
    select.innerHTML = "";

    villages.forEach(v => {
        select.innerHTML += `<option selected>${v.name}</option>`;
    });
};

loadUsers();
</script>

{% endblock %}

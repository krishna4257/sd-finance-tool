{% extends "base.html" %}
{% block content %}

<h2 class="page-title">User Management</h2>

<div class="raised-box user-header-box">
    <button id="btn-add" class="neumorphic-btn">+ Add User</button>
</div>

<div class="raised-box">
  <div class="customer-table-wrapper">
    <table id="userTable" class="dataTable customer-table">
        <thead>
            <tr>
                <th>Username</th>
                <th>Employee</th>
                <th>Device ID</th>
                <th>Role</th>
                <th>Assigned Villages</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div id="user-modal" class="raised-box user-modal" style="display:none;">

    <label>Employee</label>
    <select id="u_employee" class="input"></select>

    <label>Username</label>
    <input id="u_username" class="input">

    <label>Password</label>
    <input id="u_password" type="password" class="input">

    <label>Role (Auto from Employee)</label>
    <input id="u_role_display" class="input" disabled>

    <label>Assigned Villages (Auto)</label>
    <select id="u_villages_display" class="input" multiple disabled style="height:120px;"></select>

    <div style="margin-top:15px;">
        <button id="u_save" class="neumorphic-btn">Save</button>
        <button id="u_cancel" class="neumorphic-btn">Cancel</button>
    </div>
</div>

<!-- Village Assignment Modal -->
<div id="village-modal" class="modal-overlay" style="display:none;">

    <div class="raised-box village-modal-box">

        <h3 style="margin-bottom:15px;">Assign Villages</h3>

        <input type="text" id="village-search" class="input"
               placeholder="Search villages..." style="margin-bottom:10px;">

        <div style="margin-bottom:10px;">
            <button id="select-all" class="neumorphic-btn small">Select All</button>
            <button id="clear-all" class="neumorphic-btn small">Clear All</button>
        </div>

        <div style="display:flex; gap:10px; align-items:center; margin-top:10px;">

    <div style="flex:1;">
        <h4 id="all-count">All Villages (0)</h4>
        <div id="all-villages-list"
             style="max-height:260px; overflow:auto; border:1px solid #444; padding:6px; border-radius:6px;"></div>
    </div>

    <div style="display:flex; flex-direction:column; gap:6px;">
        <button id="move-right" class="neumorphic-btn small">&gt;&gt;</button>
        <button id="move-left" class="neumorphic-btn small">&lt;&lt;</button>
    </div>

    <div style="flex:1;">
        <h4 id="selected-count">Selected Villages (0)</h4>
        <div id="selected-villages-list"
             style="max-height:260px; overflow:auto; border:1px solid #444; padding:6px; border-radius:6px;"></div>
    </div>

</div>

        <div style="margin-top:15px; text-align:right;">
            <button id="village-save" class="neumorphic-btn">Save</button>
            <button id="village-cancel" class="neumorphic-btn">Cancel</button>
        </div>

    </div>
</div>


<script>
let selectedUserId = null;

async function csrfFetch(url, options = {}) {
    const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') ||
                      document.querySelector('input[name="csrf_token"]')?.value || "";

    options.headers = {
        ...(options.headers || {}),
        'X-CSRFToken': csrfToken
    };

    options.credentials = 'same-origin';

    return fetch(url, options);
}
async function loadEmployees() {
    const res = await fetch('/api/employees');
    const data = await res.json();
    const select = document.getElementById("u_employee");
    select.innerHTML = '';
    data.forEach(e => {
        select.innerHTML += `<option value="${e.eid}">${e.name}</option>`;
    });
}

document.getElementById("btn-add").onclick = async () => {
    await loadEmployees();

    // Reset form
    document.getElementById("u_username").value = "";
    document.getElementById("u_password").value = "";
    document.getElementById("u_role_display").value = "";
    document.getElementById("u_villages_display").innerHTML = "";

    const userModal = document.getElementById("user-modal");
    userModal.style.display = "block";
    userModal.classList.add("show");
};

async function loadUsers(){
    const res = await fetch('/api/users/list');
    const users = await res.json();
    window.cachedUsers = users;

    const tbody = document.querySelector('#userTable tbody');
    tbody.innerHTML = '';

    users.forEach(u=>{
        const tr = document.createElement('tr');
        tr.classList.add("data-row");

        tr.innerHTML = `
            <td>${u.username}</td>
            <td>${u.employee_name || '-'}</td>
            <td>${u.device_id || '-'}</td>
            <td>${u.role}</td>
            <td class="left-align">
              ${(u.villages || []).map(v => `${v.vid} - ${v.name} - ${v.district}`).join('<br>') || '-'}
            </td>
            <td>
              <span class="${u.is_active ? 'status-active' : 'status-defaulted'}">
                ${u.is_active ? 'Active' : 'Disabled'}
              </span>
            </td>
            <td class="action-buttons">
                <button class="neumorphic-btn small table-btn toggle-status-btn" data-id="${u.id}" data-active="${u.is_active}">
                    ${u.is_active ? 'Deactivate' : 'Activate'}
                </button>
                ${u.role === 'mgmt' ? `
                    <button class="neumorphic-btn small table-btn reset-device-btn" data-id="${u.id}">
                        Reset Device
                    </button>
                ` : ``}
                <button class="neumorphic-btn small table-btn edit-villages-btn" data-id="${u.id}">
                     ${(u.villages && u.villages.length > 0) ? 'Edit Villages' : 'Add Villages'}
                </button>
            </td>
        `;

        tbody.appendChild(tr);
    });
    
}

const tbody = document.querySelector('#userTable tbody');
tbody.onclick = async function(e) {
    const btn = e.target.closest('button');
    if (!btn) return;

    const id = btn.dataset.id;

    if (btn.classList.contains('toggle-status-btn')) {
        const isActive = btn.dataset.active === "true";
        if (!confirm(isActive ? "Deactivate this user?" : "Activate this user?")) return;

        const r = await csrfFetch('/api/users/toggle_status', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({id})
        });

        const j = await r.json();
        if (j.ok) loadUsers();
        else alert(j.msg);
    }

    if (btn.classList.contains('reset-device-btn')) {
        if (!confirm("Reset device?")) return;

        const r = await csrfFetch('/api/users/reset_device', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({id})
        });

        const j = await r.json();
        if (j.ok) loadUsers();
    }

    if (btn.classList.contains('edit-villages-btn')) {
        selectedUserId = id;

        const vRes = await fetch('/api/villages');
        const allVillages = await vRes.json();

        const user = window.cachedUsers.find(x => x.id == id);
        const assignedSet = new Set((user?.villages || []).map(v => v.vid));

        const allContainer = document.getElementById("all-villages-list");
        const selectedContainer = document.getElementById("selected-villages-list");

        allContainer.innerHTML = "";
        selectedContainer.innerHTML = "";

        allVillages.forEach(v => {
            const label = document.createElement("label");
            label.className = "village-item";

            label.innerHTML = `
                <input type="checkbox" value="${v.vid}">
                <span class="vid">${v.vid}</span>
                <span class="vname">${v.name || ''}</span>
                <span class="vdistrict">${v.district || ''}</span>
            `;

            if (assignedSet.has(v.vid)) {
                selectedContainer.appendChild(label);
            } else {
                allContainer.appendChild(label);
            }
        });

        updateVillageCounts();

        const villageModal = document.getElementById("village-modal");
        villageModal.style.display = "flex";
        villageModal.classList.add("show");
    }
};

document.getElementById("u_cancel").onclick = () => {
    const userModal = document.getElementById("user-modal");
    userModal.classList.remove("show");
    userModal.style.display = "none";
};

document.getElementById("village-cancel").onclick = () => {
    const villageModal = document.getElementById("village-modal");
    villageModal.classList.remove("show");
    villageModal.style.display = "none";
};

document.getElementById("village-save").onclick = async () => {

    const selected = Array.from(
        document.querySelectorAll('#selected-villages-list input')
    ).map(cb => cb.value);

    const res = await csrfFetch('/api/users/update_villages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: selectedUserId, village_ids: selected })
    });

    const j = await res.json();

    if (j.ok) {
        const villageModal = document.getElementById("village-modal");
        villageModal.classList.remove("show");
        villageModal.style.display = "none";
        loadUsers();
    } else {
        alert(j.msg || "Failed to update villages");
    }
};

document.getElementById("u_save").onclick = async () => {

    const payload = {
        username: document.getElementById("u_username").value,
        password: document.getElementById("u_password").value,
        employee_id: document.getElementById("u_employee").value
    };

    const res = await csrfFetch("/api/users/add", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    });

    const j = await res.json();

    if (j.ok) {
        const userModal = document.getElementById("user-modal");
        userModal.classList.remove("show");
        userModal.style.display = "none";
        loadUsers();
    } else {
        alert(j.msg);
    }
};

document.getElementById("u_employee").onchange = async function () {

    const eid = this.value;

    // Fetch employee level
    const empRes = await fetch(`/api/employee_level?eid=${eid}`);
    const empData = await empRes.json();
    document.getElementById("u_role_display").value = empData.level || "";

    // Fetch villages automatically
    const villageRes = await fetch(`/api/villages_by_employee?eid=${eid}`);
    const villages = await villageRes.json();

    const select = document.getElementById("u_villages_display");
    select.innerHTML = "";

    villages.forEach(v => {
        select.innerHTML += `<option selected>${v.name}</option>`;
    });
};

document.getElementById("village-search").oninput = function () {
    const term = this.value.toLowerCase();
    document.querySelectorAll("#all-villages-list label").forEach(label => {
        label.style.display = label.innerText.toLowerCase().includes(term) ? "grid" : "none";
    });
};

document.getElementById("select-all").onclick = () => {
    document.querySelectorAll('#all-villages-list input').forEach(cb => cb.checked = true);
};

document.getElementById("clear-all").onclick = () => {
    document.querySelectorAll('#all-villages-list input').forEach(cb => cb.checked = false);
};

document.getElementById("move-right").onclick = () => {
    const allContainer = document.getElementById("all-villages-list");
    const selectedContainer = document.getElementById("selected-villages-list");

    const checked = allContainer.querySelectorAll("input:checked");

    checked.forEach(cb => {
        const label = cb.closest("label");
        cb.checked = false;
        selectedContainer.appendChild(label);
    });

    updateVillageCounts();
};

document.getElementById("move-left").onclick = () => {
    const allContainer = document.getElementById("all-villages-list");
    const selectedContainer = document.getElementById("selected-villages-list");

    const checked = selectedContainer.querySelectorAll("input:checked");

    checked.forEach(cb => {
        const label = cb.closest("label");
        cb.checked = false;
        allContainer.appendChild(label);
    });

    updateVillageCounts();
};

function updateVillageCounts() {
    document.getElementById("all-count").innerText =
        `All Villages (${document.querySelectorAll('#all-villages-list label').length})`;

    document.getElementById("selected-count").innerText =
        `Selected Villages (${document.querySelectorAll('#selected-villages-list label').length})`;
}
</script>

<script>
// Optional: background click closes modal
document.getElementById("village-modal").onclick = function(e) {
    if (e.target.id === "village-modal") {
        this.classList.remove("show");
        this.style.display = "none";
    }
};

loadUsers();
</script>

{% endblock %}

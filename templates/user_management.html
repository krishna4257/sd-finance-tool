{% extends "base.html" %}
{% block content %}

<h2 class="page-title">User Management</h2>

<div class="raised-box" style="padding:20px; margin-bottom:20px;">
    <button id="btn-add" class="neumorphic-btn">+ Add User</button>
</div>

<div class="raised-box scroll-table-wrapper">
    <table id="users-table" class="dataTable customer-table" style="width:100%;">
        <thead>
            <tr>
                <th>Username</th>
                <th>Device ID</th>
                <th>Notes</th>
                <th>Role</th>
                <th>Team</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<!-- Modal -->
<div id="user-modal" class="raised-box" 
     style="display:none; padding:20px; max-width:400px; margin:auto;">

    <label>Username</label>
    <input id="u_username" class="input" placeholder="username">

    <label>Password</label>
    <input id="u_password" class="input" placeholder="password (empty to keep)">

    <label>Device ID</label>
    <input id="u_system" class="input" placeholder="system id">

    <label>Notes</label>
    <textarea id="u_notes" class="input" placeholder="notes"></textarea>

    <label>Role</label>
    <select id="u_role" class="input">
        <option value="user">User</option>
        <option value="admin">Admin</option>
    </select>
    <label>Team</label>
    <select id="u_team" class="input">
       <option value="teamA">Team A</option>
       <option value="teamB">Team B</option>
    </select>
    
    <div style="margin-top:10px;">
        <button id="u_save" class="neumorphic-btn">Save</button>
        <button id="u_cancel" class="neumorphic-btn">Cancel</button>
    </div>
</div>


<script>
async function loadUsers(){
    const res = await fetch('/api/users/list');
    const users = await res.json();

    const tbody = document.querySelector('#users-table tbody');
    tbody.innerHTML = '';

    users.forEach(u=>{
        const tr = document.createElement('tr');
        tr.classList.add("data-row");

        // IMPORTANT: store role for edit popup
        tr.dataset.role = u.role || "user";

        tr.innerHTML = `
            <td>${u.username}</td>
            <td>${u.system_id || ''}</td>
            <td>${u.notes || ''}</td>
            <td>${u.role}</td>
            <td>${u.team || "teamA"}</td>
            <td class="action-buttons">
                <button class="neumorphic-btn small edit" data-user="${u.username}">Edit</button>
                <button class="neumorphic-btn small delete-btn" data-user="${u.username}">Delete</button>
                <button class="neumorphic-btn small reset-device reset-device-btn" data-user="${u.username}">Device</button>
            </td>
        `;
        tbody.appendChild(tr);
    });

    document.querySelectorAll('.edit').forEach(el=>{
        el.onclick = () => openEdit(el.dataset.user);
    });

    document.querySelectorAll('.delete-btn').forEach(el=>{
        el.onclick = async () => {
            if(!confirm("Delete user " + el.dataset.user + "?")) return;
            const r = await fetch('/api/users/delete', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({username: el.dataset.user})
            });
            const j = await r.json();
            if(j.ok) loadUsers();
        };
    });

    document.querySelectorAll('.reset-device').forEach(el => {
          el.onclick = async () => {
             if (!confirm("Reset device for " + el.dataset.user + "?")) return;
             const res = await fetch('/api/users/reset_device', {
                 method: "POST",
                 headers: {"Content-Type": "application/json"},
                 body: JSON.stringify({username: el.dataset.user})
             });
             const j = await res.json();
             if (j.ok) loadUsers();
             else alert(j.msg);
        };
    });
}

function showModal(data){
    document.getElementById("user-modal").style.display = "block";

    document.getElementById("u_username").value = data.username || "";
    document.getElementById("u_password").value = "";
    document.getElementById("u_system").value = data.system_id || "";
    document.getElementById("u_notes").value = data.notes || "";

    document.getElementById("u_role").value = data.role || "user";
    document.getElementById("u_team").value = data.team || "teamA";
    document.getElementById("u_username").dataset.orig = data.username || "";
}

function hideModal(){
    document.getElementById("user-modal").style.display = "none";
}

function openEdit(username){
    const row = [...document.querySelectorAll("#users-table tbody tr")]
        .find(r => r.children[0].innerText === username);

    showModal({
        username: row.children[0].innerText,
        system_id: row.children[1].innerText,
        notes: row.children[2].innerText,
        role: row.dataset.role,
        team: row.dataset.team || "teamA"
    });
}

document.getElementById("btn-add").onclick = () => showModal({});

document.getElementById("u_cancel").onclick = hideModal;

document.getElementById("u_save").onclick = async () => {
    const orig = document.getElementById("u_username").dataset.orig || "";
    const username = document.getElementById("u_username").value.trim();
    const password = document.getElementById("u_password").value.trim();
    const system_id = document.getElementById("u_system").value.trim();
    const notes = document.getElementById("u_notes").value.trim();
    const role = document.getElementById("u_role").value.trim();
    const team = document.getElementById("u_team").value.trim();
    let payload = {};

    if (!orig) {
        // ---------------------
        // CREATE NEW USER
        // ---------------------
        if (!username || !password) {
            alert("Username & Password required");
            return;
        }

        payload = {
            username: username,
            password: password,         // <-- FIXED
            system_id: system_id,
            notes: notes,
            role: role,
            team: team
        };

    } else {
        // ---------------------
        // EDIT EXISTING USER
        // ---------------------
        payload = {
            username: orig,
            new_username: username !== orig ? username : undefined,
            new_password: password || undefined,  // only update if provided
            system_id: system_id || undefined,
            notes: notes || undefined,
            role: role || undefined,
            team: team || undefined
        };
    }

    // Clean undefined fields
    Object.keys(payload).forEach(k => payload[k] === undefined && delete payload[k]);

    const url = orig ? "/api/users/edit" : "/api/users/add";

    const res = await fetch(url, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    });

    const j = await res.json();
    if (j.ok) {
        hideModal();
        loadUsers();
    } else {
        alert(j.msg || "Error saving user");
    }
};

loadUsers();
</script>

{% endblock %}

<!DOCTYPE html>
<html lang="en">

<head>
  <script>
    (function () {
      var saved = localStorage.getItem('sd-theme') || 'light';
      if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Investor Self-Service Portal – Siva Durga Finance</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">

  <!-- Fonts: Inter & Manrope & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@0.441.0/dist/umd/lucide.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .bg-dot-matrix {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(rgba(15, 23, 42, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .dark .bg-dot-matrix {
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    }
  </style>
</head>

<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex items-center justify-center p-4 relative">

  <div class="bg-dot-matrix"></div>

  <!-- Main Card -->
  <div class="max-w-md w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-xl p-8 relative z-10 space-y-6">

    <!-- Top Branding -->
    <div class="text-center space-y-2">
      <div class="inline-flex h-14 w-14 rounded-2xl bg-gradient-to-tr from-amber-500/20 to-emerald-500/20 border border-amber-500/30 items-center justify-center text-amber-500 shadow-md shadow-amber-500/10">
        <i data-lucide="landmark" class="w-7 h-7"></i>
      </div>
      <div>
        <h1 class="text-xl font-display font-extrabold text-slate-900 dark:text-white tracking-tight">
          SIVA DURGA FINANCE
        </h1>
        <p class="text-xs font-semibold text-amber-600 dark:text-amber-400 uppercase tracking-wider mt-0.5">
          Investor Self-Service Portal
        </p>
      </div>
      <p class="text-xs text-slate-500 dark:text-slate-400">
        Access your live investment balance, compound returns, route deployments, and account statements.
      </p>
    </div>

    <!-- Error message alert if present -->
    {% if error %}
      <div class="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900/50 text-xs font-semibold text-rose-600 dark:text-rose-400 flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <!-- Login Form -->
    <form method="POST" action="/banking/portal/login" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
          Username or Registered Phone *
        </label>
        <div class="relative">
          <input type="text" name="identifier" required placeholder="e.g. 9876543210 or INV-001"
            class="w-full text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 pl-9 pr-3 py-2.5 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-500">
          <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
          Password / PIN *
        </label>
        <div class="relative">
          <input type="password" name="password" required placeholder="••••••••"
            class="w-full text-xs font-mono rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 pl-9 pr-3 py-2.5 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-500">
          <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs pt-1">
        <label class="flex items-center gap-2 cursor-pointer text-slate-600 dark:text-slate-400">
          <input type="checkbox" name="remember_me" class="rounded text-amber-500 focus:ring-amber-500">
          <span>Remember me</span>
        </label>
        <span class="text-[11px] text-slate-400">Default PIN: 123456</span>
      </div>

      <button type="submit"
        class="w-full py-3 rounded-2xl text-xs font-bold text-white bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 shadow-md shadow-amber-500/20 active:scale-95 transition-all flex items-center justify-center gap-2">
        <span>Sign In to Investor Folio</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <!-- Footer Links -->
    <div class="pt-4 border-t border-slate-100 dark:border-slate-800 text-center">
      <a href="/login" class="text-xs font-medium text-slate-500 hover:text-slate-900 dark:hover:text-white transition-colors">
        &larr; Switch to Staff / Admin Login
      </a>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>

</html>
